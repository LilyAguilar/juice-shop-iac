name: Seguridad IaC

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  iac:
    name: Escaneo IaC
    runs-on: ubuntu-latest
    env:
      CHECKOV_VERSION: '3.2.495'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Checkov
        run: python -m pip install "checkov==$CHECKOV_VERSION"

      - name: Preparar archivos para el escaneo
        run: |
          mkdir -p "$RUNNER_TEMP/iac"
          cp -r terraform Dockerfile politicas "$RUNNER_TEMP/iac/"

      - name: Verificar política de retención
        run: |
          cd "$RUNNER_TEMP/iac"
          sample="$(mktemp -d "$RUNNER_TEMP/retention-policy.XXXXXX")"
          for days in 30 7; do
            cat > "$sample/main.tf" <<EOF
          resource "aws_cloudwatch_log_group" "policy_test" {
            name              = "/iac/policy-test"
            retention_in_days = $days
          }
          EOF
            status=0
            output="$(checkov -d "$sample" --framework terraform \
              --external-checks-dir politicas --check CKV2_ORG_1 --compact)" || status=$?
            echo "CKV2_ORG_1 con retención de $days días (código $status)"
            echo "$output"
            if [[ "$days" == 30 ]]; then
              test "$status" -eq 0
              grep -Fq 'PASSED for resource: aws_cloudwatch_log_group.policy_test' <<< "$output"
            else
              test "$status" -eq 1
              grep -Fq 'FAILED for resource: aws_cloudwatch_log_group.policy_test' <<< "$output"
            fi
          done

      - name: Generar SARIF
        run: |
          cd "$RUNNER_TEMP/iac"
          checkov -d . --framework terraform dockerfile \
            --external-checks-dir politicas \
            --output sarif --output-file-path reportes --soft-fail
          test -s reportes/results_sarif.sarif

      - name: Publicar SARIF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: ${{ runner.temp }}/iac/reportes/results_sarif.sarif
          if-no-files-found: error

      - name: Gate de Checkov
        run: |
          cd "$RUNNER_TEMP/iac"
          checkov -d . --framework terraform dockerfile \
            --external-checks-dir politicas \
            --compact --quiet
